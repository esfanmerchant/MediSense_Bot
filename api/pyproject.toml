[project]
name = "medisense-api"
version = "0.1.0"
description = "MediSense — Smart Healthcare Management System API"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "structlog>=24.4",
    "httpx>=0.28",
    "supabase>=2.10",
]

[project.optional-dependencies]
ocr = [
    "paddlepaddle==3.3.1",
    "paddleocr>=3.0",
    "pillow>=11.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.14",
    "types-python-dateutil",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",   # pytest uses assert
    "B008",   # FastAPI Depends() in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]          # test fixtures carry obvious fake secrets
"alembic/*" = ["E501", "N999"]
# Audit action names like PASSWORD_CHANGED are enum members, not credentials.
"app/db/enums.py" = ["S105"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["paddleocr.*", "supabase.*", "paddle.*"]
ignore_missing_imports = true
