# Declared rather than left to pip's default, so the backend that builds this
# is the same one everywhere — a CI runner, a Docker build and a laptop should
# not each pick their own.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medisense-api"
version = "0.1.0"
description = "MediSense — Smart Healthcare Management System API"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "structlog>=24.4",
    # Storage talks to Supabase over its REST API rather than through the
    # `supabase` SDK: the surface is four calls, the SDK's client is
    # synchronous and would block the event loop, and a healthcare service is
    # better off with one less dependency in its tree.
    "httpx>=0.28",
    # Two-factor authentication: TOTP codes, and the QR that enrols them.
    # `segno` is pure Python and writes an SVG we can inline, so no image
    # toolchain and nothing to fetch from a CDN.
    "pyotp>=2.9",
    "segno>=1.6",
    # Web Push. The payload is encrypted to keys the browser generated, so the
    # push service in the middle carries ciphertext it cannot open — which is
    # the only way a reminder naming a medicine is safe to send through one.
    # Hand-rolling aes128gcm and VAPID signing for a healthcare product would
    # be the wrong kind of clever.
    "pywebpush>=2.0",
    # Optional at runtime, not at install time. Nothing imports it unless
    # REDIS_URL is set, and every caller falls back to the in-process
    # behaviour when it is absent — so a single-worker deployment needs no
    # Redis, and a multi-worker one gets a correct rate limiter and a live
    # feed that reaches every browser rather than one worker's share.
    "redis>=5.2",
]

[project.optional-dependencies]
ocr = [
    "paddlepaddle==3.3.1",
    "paddleocr>=3.0",
    "pillow>=11.0",
    # Rasterises PDF pages for OCR. Ships its own PDFium build, so this needs
    # no system Poppler and behaves the same on Windows as in a container.
    "pypdfium2>=4.30",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.14",
    "types-python-dateutil",
    # Renders the sample prescription the extraction tests read. Small, and it
    # lets those tests run with only an AI key — no 500 MB local engine needed.
    "pillow>=11.0",
]

# **The application is `app`. `alembic` is not a package this ships.**
#
# Without this, setuptools' automatic discovery looks at a flat layout holding
# both `app/` and `alembic/`, cannot choose between them, and refuses to build
# at all:
#
#   error: Multiple top-level packages discovered in a flat-layout:
#          ['app', 'alembic']
#
# It stayed hidden for a long time because neither place that mattered could see
# it. A laptop already has the package installed and never re-runs discovery,
# and the Dockerfile copies only `pyproject.toml` and `app/__init__.py` before
# installing — so at that moment `alembic/` does not exist and there is nothing
# ambiguous to find. Only a clean install against the whole checkout, which is
# exactly what CI does, hits it.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",   # pytest uses assert
    "B008",   # FastAPI Depends() in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]          # test fixtures carry obvious fake secrets
"alembic/*" = ["E501", "N999"]
# Audit action names like PASSWORD_CHANGED are enum members, not credentials.
"app/db/enums.py" = ["S105"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages that ship no type information. Listed explicitly rather
# than globally ignored, so a genuinely missing import is still an error.
# `numpy` arrives with the `ocr` extra, not with `dev` — so a machine that has
# run the local OCR engine has it and a CI runner does not. Listing it here is
# what stops `mypy app` passing on a laptop and failing on a clean install,
# which is precisely how it was found.
module = ["paddleocr.*", "paddle.*", "pypdfium2.*", "pywebpush.*", "numpy.*"]
ignore_missing_imports = true
