<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <title>MediSense</title>
  <!--
    The browser-tab icon: the same mark `components/brand/Logo.tsx` draws, set
    on a square canvas because a tab icon is square and the lockup is not.

    The artwork is unchanged and simply centred — the cross spans y 2..44 in the
    source, so it is shifted down seven to sit in the middle of sixty. Nothing
    is redrawn, which is what keeps the tab and the header the same mark rather
    than two drawings that drift apart.

    SVG rather than a raster export: one file stays sharp from the 16-pixel tab
    to the 180-pixel home-screen tile, and the gradient survives instead of
    being flattened into mud at small sizes.
  -->
  <defs>
    <linearGradient id="ms-icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3FA8" />
      <stop offset="0.55" stop-color="#1A8FC7" />
      <stop offset="1" stop-color="#14C4C1" />
    </linearGradient>
  </defs>

  <g transform="translate(0,7)">
    <path
      d="M17 2h10a3 3 0 0 1 3 3v9h9a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-9v9a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3v-9H5a3 3 0 0 1-3-3V17a3 3 0 0 1 3-3h9V5a3 3 0 0 1 3-3Z"
      fill="url(#ms-icon)"
    />
    <path
      d="M5 25h9l3-8 4 16 3-8h4"
      stroke="#FFFFFF"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <g stroke="url(#ms-icon)" stroke-width="1.8" stroke-linecap="round" fill="none">
      <path d="M42 18h8" />
      <path d="M42 25h12" />
      <path d="M42 32h8" />
      <path d="M46 18v-6h6" />
      <path d="M46 32v6h6" />
    </g>
    <g fill="url(#ms-icon)">
      <circle cx="52" cy="12" r="2.6" />
      <circle cx="56" cy="25" r="2.6" />
      <circle cx="52" cy="38" r="2.6" />
    </g>
  </g>
</svg>
